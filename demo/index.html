<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>django-chat-ui demo</title>
    <link rel="stylesheet" href="../src/django_chat_ui/static/django_chat_ui/chat.css">
    <link rel="stylesheet" href="demo.css">
    <script type="module" src="demo.js"></script>
</head>
<body>
    <main class="demo">
        <section class="demo-inbox">
            <h2>Inbox (agent)</h2>
            <chat-inbox></chat-inbox>
        </section>
        <section class="demo-site">
            <h2>Site (visitor)</h2>
            <p>The button at the bottom right is <code>&lt;chat-widget&gt;</code>: it opens a new conversation with the assistant.</p>
        </section>
    </main>
    <chat-widget heading="Support" subheading="We answer in minutes" channel="web"></chat-widget>
</body>
</html>
