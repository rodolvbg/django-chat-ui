<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>django-chat-ui demo</title>
    <link rel="stylesheet" href="../src/django_chat_ui/static/django_chat_ui/chat.css">
    <link rel="stylesheet" href="demo.css">
    <script type="module" src="demo.js"></script>
</head>
<body>
    <main class="demo">
        <section class="demo-inbox">
            <h2>Bandeja (agente)</h2>
            <chat-inbox></chat-inbox>
        </section>
        <section class="demo-site">
            <h2>Web (visitante)</h2>
            <p>El botón de abajo a la derecha es <code>&lt;chat-widget&gt;</code>: abre una conversación nueva con el asistente.</p>
        </section>
    </main>
    <chat-widget heading="Soporte" subheading="Te respondemos en minutos" channel="web"></chat-widget>
</body>
</html>
