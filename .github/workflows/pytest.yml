name: Python and Playwright Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      # matrix-js-sdk, for the test of a Matrix client against the server.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install the JavaScript dependencies
        run: npm ci

      - name: Run Pytest
        run: uv run pytest

      - name: Run Pytest with a site's own models
        run: uv run pytest --ds tests.settings_swapped --cov-append
